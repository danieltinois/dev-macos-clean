id: homebrew-cache
name: Homebrew cache
category: homebrew
severity: SAFE
reclaimable: true
description: Downloads e artefatos de instalação armazenados pelo Homebrew. Os programas instalados permanecem intactos; instalações e reinstalações podem precisar baixar os pacotes novamente.
paths:
  - "~/Library/Caches/Homebrew"
rebuild:
  description: O Homebrew baixa os arquivos novamente quando necessário durante brew install, brew reinstall ou brew fetch.
