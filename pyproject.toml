[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devclean"
version = "0.1.0"
description = "Analyze macOS developer storage: what uses space and what can be reclaimed."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["macos", "storage", "cleaner", "developer-tools", "cli"]
dependencies = [
    "pydantic>=2.7",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
devclean = "devclean.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
devclean = ["rules/*.yaml", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]